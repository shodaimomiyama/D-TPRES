[package]
name = "contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
cosmwasm-std = { version = "1.0.0-beta8", features = ["staking"] }
serde = { version = "1.0.103", default-features = false, features = ["derive"] }
serde_json = "1.0"
cw-storage-plus = "0.13.4"
thiserror = "1"
zeroize = { version = "1.6", features = ["derive"] }

[dev-dependencies]
cw-multi-test = "0.13.4"