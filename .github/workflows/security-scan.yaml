name: Security Scan

on:
  schedule:
    # 毎週月曜日 9:00 JST (00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch: # 手動実行を許可

permissions:
  contents: read
  security-events: write # GitHub Security タブへの書き込み権限

jobs:
  cargo-audit:
    name: Cargo Audit (Dependency Vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0

      - name: Cache cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit

      - name: Install cargo-audit
        run: cargo install cargo-audit || true

      - name: Run cargo audit
        run: |
          echo "::group::Cargo Audit Report"
          cargo audit --json > audit-report.json || true
          cargo audit
          echo "::endgroup::"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cargo-audit-report
          path: audit-report.json
          retention-days: 30

      - name: Check for critical vulnerabilities
        run: |
          # critical/high の脆弱性があればCI失敗させる
          cargo audit --deny warnings

  cargo-deny:
    name: Cargo Deny (License & Security Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0

      - name: Install cargo-deny
        run: cargo install cargo-deny || true

      - name: Run cargo deny
        run: |
          echo "::group::Cargo Deny Report"
          cargo deny check
          echo "::endgroup::"

  trivy-scan:
    name: Trivy (Container Image Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t crescent-uniswapx-quoter:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "crescent-uniswapx-quoter:scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Trivy (table format for logs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "crescent-uniswapx-quoter:scan"
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [cargo-audit, cargo-deny, trivy-scan]
    if: always()  
    steps:
      - name: Summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Cargo Audit: ${{ needs.cargo-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Cargo Deny: ${{ needs.cargo-deny.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy Scan: ${{ needs.trivy-scan.result }}" >> $GITHUB_STEP_SUMMARY
