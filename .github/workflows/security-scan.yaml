name: Security Scan

on:
  schedule:
    # 毎週月曜日 9:00 JST (00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch: # 手動実行を許可

permissions:
  contents: read
  security-events: write # GitHub Security タブへの書き込み権限

jobs:
  cargo-audit:
    name: Cargo Audit (Dependency Vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo-audit
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit

      - name: Install cargo-audit
        run: cargo install cargo-audit || true

      - name: Run cargo audit
        run: |
          echo "::group::Cargo Audit Report"
          cargo audit --json > audit-report.json || true
          cargo audit
          echo "::endgroup::"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cargo-audit-report
          path: audit-report.json
          retention-days: 30

      - name: Check for critical vulnerabilities
        run: |
          # critical/high の脆弱性があればCI失敗させる
          cargo audit --deny warnings

  cargo-deny:
    name: Cargo Deny (License & Security Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-deny
        run: cargo install cargo-deny || true

      - name: Run cargo deny
        run: |
          echo "::group::Cargo Deny Report"
          cargo deny check
          echo "::endgroup::"

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [cargo-audit, cargo-deny]
    if: always()  
    steps:
      - name: Summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Cargo Audit: ${{ needs.cargo-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Cargo Deny: ${{ needs.cargo-deny.result }}" >> $GITHUB_STEP_SUMMARY
