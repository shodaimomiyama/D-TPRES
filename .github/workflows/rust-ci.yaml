name: Rust CI

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [client, ao/contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --all-targets
        working-directory: ${{ matrix.project }}

  fmt:
    name: Rustfmt (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [client, ao/contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check
        working-directory: ${{ matrix.project }}

  clippy:
    name: Clippy (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [client, ao/contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: clippy
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-targets -- -D warnings -A clippy::module_inception
        working-directory: ${{ matrix.project }}

  security-audit:
    name: Security Audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [client, ao/contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit --deny warnings
        working-directory: ${{ matrix.project }}

  test:
    name: Test (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [check, fmt, clippy, security-audit]
    strategy:
      matrix:
        project: [client, ao/contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Run cargo test
        run: cargo test --all-targets --verbose -- --nocapture
        working-directory: ${{ matrix.project }}

  wasm-build:
    name: WASM Build (client)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: wasm-pack build --target web
        working-directory: client
