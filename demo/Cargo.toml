[package]
name = "formix-demo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "formix-demo"
path = "src/main.rs"

[dependencies]
formix = { path = "../client", features = ["production-ao", "key-export"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
anyhow = "1"
dotenvy = "0.15"
tokio = { version = "1", features = ["rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
contract = { path = "../ao/contracts" }
cosmwasm-std = { version = "1.0.0-beta8", features = ["staking"] }
bincode = "1.3"
uuid = { version = "1", features = ["v4"] }
