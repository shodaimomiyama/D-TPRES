version: '3.8'

services:
  serena:
    image: ghcr.io/oraios/serena:latest
    container_name: serena-mcp-server
    restart: unless-stopped
    tty: true
    stdin_open: true
    volumes:
      # プロジェクトディレクトリをマウント
      - ../../:/workspace:rw
    working_dir: /workspace
    environment:
      # 必要に応じて環境変数を設定
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
