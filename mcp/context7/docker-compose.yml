version: '3.8'

services:
  context7-mcp:
    build: .
    image: context7-mcp:latest
    container_name: context7-mcp-server
    restart: unless-stopped
    # MCPサーバーは標準入出力でやり取りするため、ttyとstdinを有効にする
    tty: true
    stdin_open: true
    # ログ設定
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
