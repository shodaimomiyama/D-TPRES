[package]
name = "d_tpres"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = []
wasm-ao = []        # AO環境用ビルド
local = []          # ローカル実行用ビルド
browser = ["wasm-bindgen", "js-sys", "web-sys", "getrandom/js"]  # ブラウザ用ビルド

[dependencies]
# CosmWasm dependencies - proven stable versions
cosmwasm-std = { version = "1.0.0-beta8", features = ["staking"] }
cosmwasm-schema = "1.0.0"
serde = { version = "1.0.103", default-features = false, features = ["derive"] }
serde_json = "1.0"
cw-storage-plus = "0.13.4"
thiserror = "1"

# Browser dependencies - WASM bindgen support
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true }
getrandom = { version = "0.2", optional = true }

# Crypto libraries - both WASM and native
umbral-pre = { version = "0.11", features = ["serde", "default-serialization"] }
shamirsecretsharing = "0.1"
rand = "0.8"
subtle = "2.6"
generic-array = "0.14"
bincode = "1.3"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.8"

[dev-dependencies]
cw-multi-test = "0.13.4"
tokio = { version = "1.0", features = ["macros", "rt"] }
