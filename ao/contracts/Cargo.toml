[package]
name = "formix-ao-contract"
version = "0.1.0"
edition = "2021"
description = "FORMIX AO-native WASM contract for HyperBEAM"

[lib]
name = "formix_contract"
crate-type = ["cdylib"]

# Target: wasm32-unknown-unknown (or wasm64-unknown-unknown for Memory-64)
# Build: cargo build --target wasm32-unknown-unknown --release
# Note: wasm64-unknown-unknown is experimental; verify compatibility with HyperBEAM beamr

[dependencies]
# Core crypto - same as ao_cwao/
umbral-pre = { version = "0.11", features = ["serde", "default-serialization"] }
bincode = { version = "1.3", default-features = false }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# Utils
zeroize = { version = "1.6", features = ["derive"] }
sha2 = "0.10"
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# WASM-compatible random (custom impl required in WASM)
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
# No cw-multi-test: use in-memory tests instead

[profile.release]
opt-level = "s"   # minimize binary size
lto = true
