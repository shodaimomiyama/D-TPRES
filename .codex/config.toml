# Codex CLI 推奨設定（テンプレート）
# 注意: Codex CLI のバージョンによりキー名/構造が異なる場合があります。
# その場合は名称を読み替えてご利用ください。

[core]
project_name = "D-TPRES"
working_dir = "."
language = "ja"
approval_mode = "on-request"     # 破壊的操作は常に確認
confirm_before_writes = true
telemetry = false

[llm]
# Deep Search での長考/要約に向いたモデルを想定
provider = "openai"
model = "gpt-5"                 # 深い推論用（コスト高）
model_reasoning_effort = "high"
temperature = 0.2
max_output_tokens = 3000

[sandbox_workspace_write]
network_access = true

[formatting]
enable_rustfmt = true
format_on_write = true
rustfmt_command = "cargo fmt --all"

[lint]
clippy_command = "cargo clippy --all-targets --all-features -- -D warnings"

[commands]
build = "make check"
lint  = "make lint"
test  = "make test"
run   = "cargo run"
# PR 作成補助（必要に応じて値を差し替え）
pr    = "make pr TITLE=\"<title>\" LABELS=\"enhancement\""

[deep_search]
# リポジトリ内を段階的に広げながら探索し、要点抽出→根拠リンク化を想定
enabled    = true
max_depth  = 3          # 掘り下げの段数（要件に応じて 2〜4）
breadth    = 6          # 各段で広げる対象の数
file_limit = 300        # インデックス対象の上限
timeout_ms = 20000
include = [
  "Cargo.toml",
  "Cargo.lock",
  "Makefile",
  "src/**/*.rs",
  "config/**/*.toml",
  "docs/**/*",
  ".github/**/*",
  "rustfmt.toml",
  "clippy.toml",
  ".env.sample",
]
exclude = [
  "target/**",
  ".git/**",
  ".vscode/**",
  "infra/**",
  "infra-prod/**",
]

[indexing]
# Deep Search 前に読み込む重要ファイル
prewarm = [
  "src/main.rs",
  "src/usecase/**/*.rs",
  "src/controller/**/*.rs",
  "src/utils/**/*.rs",
  "src/config/**/*.rs",
  "docs/PRD.md",
]

[security]
# 追加確認が必要/避けたいコマンド
require_confirmation_for = ["git push", "docker-compose down"]
dangerous_commands = ["git reset --hard", "rm -rf", "docker system prune -a"]

[env]
file = ".env"                 # `.env.sample` をコピーして作成
required = []
optional = []
[ui]
show_plan = true
plan_update_interval_ms = 500
compact_logs = true
